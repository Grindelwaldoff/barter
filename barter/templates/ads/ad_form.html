{% extends "base.html" %}
{% block title %}Объявление{% endblock %}
{% block content %}
<h1 class="h5">{% if object %}Редактировать{% else %}Новое{% endif %} объявление</h1>
<form method="post" class="card card-body p-4 gap-3">
  {% csrf_token %}
  {% include "components/form_fields.html" with form=form %}
  <div>
    <button class="btn btn-primary">Сохранить</button>
  </div>
</form>
{% endblock %}
